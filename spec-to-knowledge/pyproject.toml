[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec2kb"
version = "1.0.0"
description = "Spec-to-Knowledge: convert technical PDF specifications (JEDEC, customer specs, datasheets) into a consistent Markdown knowledge base"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary (internal use)" }
dependencies = [
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30",
    "Pillow>=10",
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "Markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "mkdocs>=1.5", "playwright>=1.40"]

[project.scripts]
spec2kb = "spec2kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spec2kb = ["profiles/builtin/*.json", "web/static/**/*", "web/static/*", "selftest/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives the web UI with Playwright/Chromium (skipped when unavailable)",
    "slow: longer end-to-end runs",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]
